<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-ray fly-in demo</title>
  <link rel="icon" href="data:,">
  <style>html,body{margin:0;background:#080a09}#flyin{height:100vh}</style>
</head>
<body>
  <div id="flyin"></div>
  <script type="module">
    // ?fail=1 points the tiles at a dead URL to exercise the fallback card; ?precision=address shows the pin.
    // ?flat=1 skips Google 3D tiles; ?key=bad tries them with a bad key (403 -> MapLibre).
    const q = new URLSearchParams(location.search);
    if (q.has('fail')) window.XRAY_CONFIG = { flyinTiles: 'http://127.0.0.1:9/nope.json', mapsKey: null };
    if (q.has('flat')) window.XRAY_CONFIG = { mapsKey: null };
    if (q.has('key')) window.XRAY_CONFIG = { mapsKey: q.get('key') };
    const { flyIn } = await import('./flyin.js');
    const t0 = performance.now();
    await flyIn(document.getElementById('flyin'), {
      lat: 51.489504, lng: -0.015614, label: '24 Macquarie Way, Isle of Dogs, E14 3AU',
      precision: q.get('precision') || 'postcode_centroid', use: 'residential', durationMs: +(q.get('ms') || 7000),
    });
    document.body.dataset.resolvedMs = Math.round(performance.now() - t0); // for headless checks; the title stays clean
    console.log('resolved', document.body.dataset.resolvedMs, document.querySelector('.xf-fallback')?.dataset.reason || 'map');
  </script>
</body>
</html>
